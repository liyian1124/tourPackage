<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Package</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/all.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.18/c3.css">
  <script src="https://kit.fontawesome.com/df7c724407.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/validate.js/0.13.1/validate.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.18/c3.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.js"></script>
</head>
<body>
  <section class="addTicket-panel">
    <div class="addTicket-img">
      <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/js_week5/main_img.png?raw=true" alt="">
      <img src="https://github.com/hexschool/2022-web-layout-training/blob/main/js_week5/logo.png?raw=true" alt="">
    </div>
    <form action="" class="addTicket-form">
      <h1 class="title"><span><i class="fas fa-plus-circle"></i></span>新增旅遊套票</h1>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketName">套票名稱</label>
          <input type="text" id="ticketName" placeholder="請填寫套票名稱" name="name">
        </div>
        <div class="alert-message">
          <p id="ticketName-message" data-message="name">
              <!-- <i class="fas fa-exclamation-circle"></i>
                      <span>必填!</span> -->
          </p>
        </div>
      </div>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketImgUrl">圖片網址</label>
          <input type="text" id="ticketImgUrl" placeholder="請填寫圖片網址" name="imgUrl">
        </div>
        <div class="alert-message">
          <p id="ticketImgUrl-message" data-message="imgUrl">
            <!-- <i class="fas fa-exclamation-circle"></i>
                        <span>必填!</span> -->
          </p>
        </div>
      </div>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketRegion">景點地區</label>
          <select id="ticketRegion" name="area">
            <option value="" disabled selected hidden>請選擇景點地區</option>
            <option value="台北">台北</option>
            <option value="台中">台中</option>
            <option value="高雄">高雄</option>
          </select>
        </div>
        <div class="alert-message">
          <p id="ticketRegion-message" data-message="area">
            <!-- <i class="fas fa-exclamation-circle"></i>
                        <span>必填!</span> -->
          </p>
        </div>
      </div>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketPrice">套票金額</label>
          <input type="number" id="ticketPrice" placeholder="請填寫套票金額" name="price" min="0">
        </div>
        <div class="alert-message">
          <p id="ticketPrice-message" data-message="price">
            <!-- <i class="fas fa-exclamation-circle"></i>
                        <span>必填!</span> -->
          </p>
        </div>
      </div>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketNum">套票組數</label>
          <input type="number" id="ticketNum" placeholder="請填寫套票組數" name="group" min="1">
        </div>
        <div class="alert-message">
          <p id="ticketNum-message" data-message="group">
            <!-- <i class="fas fa-exclamation-circle"></i>
                        <span>必填!</span> -->
          </p>
        </div>
      </div>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketRate">套票星級</label>
          <input type="number" id="ticketRate" placeholder="請填寫套票星級" name="rate" min="1" max="10">
        </div>
        <div class="alert-message">
          <p id="ticketRate-message" data-message="rate">
            <!-- <i class="fas fa-exclamation-circle"></i>
                        <span>必填!</span> -->
          </p>
        </div>
      </div>
      <div class="form-group">
        <div class="addTicket-input">
          <label for="ticketDescription">套票描述</label>
          <textarea name="description" id="ticketDescription" placeholder="請填寫套票描述 (限 100 字)"></textarea>
        </div>
        <div class="alert-message">
          <p id="ticketDescription-message" data-message="description">
            <!-- <i class="fas fa-exclamation-circle"></i>
                        <span>必填!</span> -->
          </p>
        </div>
      </div>
      <input type="submit" class="addTicket-btn btn" value="新增套票">
    </form>
  </section>

    <div class="search-area-chart">

          <option value="台北">台北</option>
          <option value="台中">台中</option>
          <option value="高雄">高雄</option>
        </select>
        <p id="searchResult-text">本次搜尋共 3 筆資料</p>
      </div>
      <div class="chart">
        <div id="chart"></div>

    </div>

  </section>
